<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>킥오프</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --line: #e6e3dc; --text: #1d1c1a; --sub: #6b675f; --faint: #9a958b;
    --gold: #a87a22; --gold-bg: #fbf3e2; --blue: #2f5fb3; --blue-bg: #eaf0fb; --green: #2e7d4f; --green-bg: #e7f4ec;
    --red: #b4412f; --red-bg: #fbeae6; --gray-bg: #efede8; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--gray-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 17px; margin: 0; }
  header.top .spacer { flex: 1; }
  header.top label { color: var(--sub); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .stamp { color: var(--faint); font-size: 12px; }
  main { padding: 20px 24px 60px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--gray-bg); color: var(--sub); border: 1px solid transparent; max-width: 100%; overflow-wrap: anywhere; }
  .chip.gold { background: var(--gold-bg); color: var(--gold); }
  .chip.blue { background: var(--blue-bg); color: var(--blue); }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.red { background: var(--red-bg); color: var(--red); }
  .chip.strong { border-color: currentColor; font-weight: 600; }
  .muted { color: var(--sub); }
  .faint { color: var(--faint); }
  .err { color: var(--red); }

  /* 현황판 */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: start; }
  .col { min-width: 0; background: #efede7; border-radius: var(--radius); padding: 10px; }
  .col.is-empty { opacity: .55; }
  .col h2 { font-size: 13px; margin: 2px 4px 10px; color: var(--sub); display: flex; justify-content: space-between; }
  .col.hot { background: var(--gold-bg); opacity: 1; }
  .col.hot h2 { color: var(--gold); }
  .tcard { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 9px; }
  .tcard:hover { border-color: #cfc9bd; }
  .tcard.blocked { box-shadow: inset 3px 0 0 var(--red); }
  .col.hot .tcard { border-color: #e2c98f; }
  .tcard .t { font-weight: 600; }
  .tcard .now { font-size: 13px; font-weight: 600; margin: 3px 0 7px; }
  .tcard .row { display: flex; gap: 5px; flex-wrap: wrap; }
  .empty { color: var(--faint); font-size: 13px; padding: 2px 4px; }
  @media (max-width: 700px) { .board { grid-template-columns: 1fr; } .col.is-empty { display: none; } main { padding: 14px 12px 60px; } }

  /* 작업 화면 */
  .head { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .head .back { color: var(--sub); font-size: 13px; }
  .head h2 { margin: 6px 0 2px; font-size: 21px; }
  .nowline { font-size: 15px; font-weight: 600; margin: 2px 0 8px; }
  .head .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--sub); }
  .summary b { color: var(--text); }
  .stages { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 11px; color: var(--text); }
  .btn:hover { border-color: #bdb6a8; }
  .btn.on { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }
  .btn.primary:disabled { background: #d9cfba; border-color: #d9cfba; cursor: default; }
  .btn.danger { color: var(--red); border-color: transparent; background: none; margin-left: auto; }
  .btn.danger.on { border-color: var(--red); }
  .banner { background: var(--blue-bg); color: var(--blue); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
  .banner.green { background: var(--green-bg); color: var(--green); }
  .layout { display: grid; grid-template-columns: 400px 1fr; gap: 14px; align-items: start; }
  .layout > * { min-width: 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; position: sticky; top: 68px; max-height: calc(100vh - 84px); overflow: auto; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel.submitted .opt, .panel.submitted textarea { pointer-events: none; opacity: .6; }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    .panel { position: static; max-height: none; overflow: visible; }
    th { white-space: normal; }
  }
  .qcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
  .qcard.done { border-color: #bfdcc9; background: #fbfdfb; }
  .qcard .hd { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .qcard .q { font-weight: 600; margin-bottom: 8px; }
  .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 8px 10px; margin-top: 6px; }
  .opt:hover { border-color: #c9b47f; }
  .opt.sel { border-color: var(--gold); background: var(--gold-bg); }
  .opt .l { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .opt .d { display: block; color: var(--sub); font-size: 13px; }
  details.pv { margin-top: 6px; }
  details.pv summary { color: var(--faint); font-size: 12.5px; cursor: pointer; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; resize: vertical; min-height: 54px; margin-top: 6px; }
  .reply { background: var(--gray-bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13.5px; overflow-wrap: anywhere; }
  .foot { position: sticky; bottom: -14px; background: var(--card); padding: 12px 0 2px; margin-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .docs { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 10px; overflow-x: auto; }
  .tab { background: none; border: none; padding: 12px 10px; color: var(--sub); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--text); border-bottom-color: var(--gold); font-weight: 600; }
  .tab .n { color: var(--blue); font-size: 12px; margin-left: 3px; }
  .doc { padding: 16px 18px; overflow-x: auto; }
  .doc h4 { margin: 18px 0 8px; font-size: 14.5px; }
  .doc h4:first-child { margin-top: 0; }
  details.meta-src { margin-top: 16px; }
  details.meta-src summary { color: var(--sub); font-size: 13px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 12px; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--sub); font-weight: 500; background: #faf9f6; white-space: nowrap; }
  td:first-child { white-space: nowrap; overflow-wrap: normal; }
  tr.blk td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  td details summary { color: var(--faint); font-size: 12px; cursor: pointer; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .filters .lab { color: var(--faint); font-size: 12px; width: 32px; }
  .filters .btn { padding: 3px 9px; font-size: 12.5px; }
  pre { white-space: pre-wrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: #faf9f6; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0; overflow-wrap: anywhere; }
  .qsec { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .qsec .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  pre.prose { font: 14px/1.7 Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; background: none; border: none; padding: 4px 0; }
  ul { margin: 4px 0 10px; padding-left: 20px; }
</style>
</head>
<body>
<header class="top">
  <h1><a href="#/">킥오프</a></h1>
  <span class="spacer"></span>
  <label><input type="checkbox" id="showDone"> 완료·취소 보기</label>
  <span class="stamp" id="stamp"></span>
</header>
<main id="app"></main>
<script>
const $app = document.getElementById('app');
const STATE_CHIP = { '열림': '', '추천(확인 전)': 'gold', '질문함': 'blue', '답 옴': 'gold strong', '정함': 'green', '범위 밖': '' };
const STAGE_CHIP = { '검토 중': '', '질문 대기': 'blue', '착수 가능': 'green', '진행 중': 'gold strong', '보류': 'gold', '취소': '', '완료': 'green strong' };
const USER_STAGES = ['진행 중', '보류', '완료'];
const JIRA_KEY = /^[A-Z][A-Z0-9]+-\d+$/;
let ui = { tab: '요약', filter: '전체', owner: '전체', showDone: localStorage.getItem('kickoff.showDone') === '1' };
let last = null, lastSig = '';
const drafts = {};              // 아직 서버에 안 보낸 메모(다시 그려도 지워지지 않게)
let queue = Promise.resolve();  // 저장 요청은 한 번에 하나씩
document.getElementById('showDone').checked = ui.showDone;
document.getElementById('showDone').onchange = e => { ui.showDone = e.target.checked; localStorage.setItem('kickoff.showDone', ui.showDone ? '1' : '0'); render(true); };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
function chip(text, cls) { return `<span class="chip ${cls || ''}">${esc(text)}</span>`; }
function stageChip(s) { return chip(s || '?', STAGE_CHIP[s] ?? ''); }
function stateChip(s) { return chip(s || '?', STATE_CHIP[s] ?? ''); }
function roles(text) { return String(text || '').split('+').map(o => o.replace(/\(.*?\)/g, '').trim()).filter(Boolean); }
function splitRow(line) {
  const go = honor => {
    let s = line.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = []; let buf = '', code = false;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === '\\' && s[i + 1] === '|') { buf += '|'; i++; continue; }
      if (ch === '`' && honor) code = !code;
      if (ch === '|' && !code) { cells.push(buf.trim()); buf = ''; } else buf += ch;
    }
    cells.push(buf.trim()); return code ? null : cells;
  };
  return go(true) || go(false);
}
const isSep = l => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(String(l).trim());
function mdBlock(text, prose) {
  // preview·질문지 같은 짧은 마크다운: 표는 표로, 나머지는 줄 그대로
  const lines = String(text || '').split('\n');
  let html = '', i = 0;
  const tableStart = k => lines[k].trim().startsWith('|') && isSep(lines[k + 1] || '');
  while (i < lines.length) {
    if (tableStart(i)) {
      const tl = []; while (i < lines.length && lines[i].trim().startsWith('|')) tl.push(lines[i++]);
      html += tableHtml(splitRow(tl[0]), tl.slice(2).map(splitRow));
    } else {
      const pl = []; while (i < lines.length && !tableStart(i)) pl.push(lines[i++]);
      const t = pl.join('\n').trim(); if (t) html += `<pre class="${prose ? 'prose' : ''}">${esc(t)}</pre>`;
    }
  }
  return html;
}
function tableHtml(header, rows, rowClass, hide = []) {
  const cols = header.map((h, i) => [h, i]).filter(([h]) => !hide.includes(h));
  return `<table><thead><tr>${cols.map(([h]) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr class="${rowClass ? rowClass(r) : ''}">${cols.map(([h, i]) => `<td>${cell(h, r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function cell(h, v) {
  if (h === '상태') return STATE_CHIP[v] !== undefined ? stateChip(v) : inline(v);
  if (h === '영향') return v === '막힘' ? chip(v, 'red') : (v === '중요' ? chip(v, '') : `<span class="faint">${esc(v)}</span>`);
  if (h === '근거' && String(v || '').length > 40) return `<details><summary>근거 보기</summary>${inline(v)}</details>`;
  return inline(v);
}
function textHtml(lines) {
  let html = '', list = [];
  const flush = () => { if (list.length) { html += `<ul>${list.map(l => `<li>${inline(l)}</li>`).join('')}</ul>`; list = []; } };
  for (const l of lines) { if (/^\s*-\s+/.test(l)) list.push(l.replace(/^\s*-\s+/, '')); else { flush(); html += `<p>${inline(l)}</p>`; } }
  flush(); return html;
}
function sectionHtml(sec, opts = {}) {
  let body = '';
  for (const b of sec.blocks) {
    if (b.type === 'text') body += textHtml(b.lines);
    else {
      let rows = b.rows;
      const si = b.header.indexOf('상태'), oi = b.header.indexOf('결정 주체'), ii = b.header.indexOf('영향');
      if (opts.filter && si >= 0) rows = rows.filter(r => (ui.filter === '전체' || r[si] === ui.filter) && (ui.owner === '전체' || roles(r[oi]).includes(ui.owner)));
      body += tableHtml(b.header, rows, ii >= 0 && si >= 0 ? r => (r[ii] === '막힘' && !['정함', '범위 밖'].includes(r[si]) ? 'blk' : '') : null, opts.filter ? ['체크'] : []);
    }
  }
  if (sec.no === 0) return `<details class="meta-src" data-pv="meta"><summary>입력·출처 보기</summary>${body}</details>`;
  return `<h4>${esc(sec.title)}</h4>${body}`;
}
async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
function post(path, body) { const p = queue.then(() => api(path, body)); queue = p.catch(() => {}); return p; }
function taskUrl(slug, sub) { return `/api/task/${encodeURIComponent(slug)}${sub ? '/' + sub : ''}`; }
function waitChips(t) {
  const m = new Map();
  for (const w of t.waiting || []) {
    const k = roles(w.owner)[0] || w.owner, p = m.get(k) || { n: 0, d: null };
    p.n += w.ids.length; if (w.days != null) p.d = Math.max(p.d ?? 0, w.days); m.set(k, p);
  }
  return [...m].map(([o, p]) => chip(`${o} 답 대기 ${p.n}${p.d == null ? '' : p.d ? ` · ${p.d}일째` : ' · 오늘'}`, p.d >= 3 ? 'red' : 'blue')).join('');
}
function nextAction(t) {
  if (t.cards_open) return `질문 카드 ${t.cards_open}장 답하기` + (t.inbox_draft ? ' · 고르다 만 답 있음' : '');
  if ((t.replies_open || []).length) return `받은 답 보고 결정하기 (${t.replies_open.join(', ')})`;
  if (t.inbox_draft) return '고른 답 제출하기';
  if (t.inbox_pending) return '제출함 · 에이전트 반영 기다리는 중';
  if (t.column === '질문 대기') return '담당자 답 기다리는 중';
  if (t.column === '검토 중') return '검토 진행 중';
  if (t.column === '착수 가능') return '시작할지 정하기';
  if (t.column === '진행 중') return '진행 중';
  return '';
}

// ---------- 현황판 ----------
function renderBoard(data) {
  const cols = data.columns.filter(c => ui.showDone || !['완료', '취소'].includes(c));
  $app.innerHTML = `<div class="board">${cols.map(c => {
    const ts = data.tasks.filter(t => t.column === c);
    return `<section class="col ${c === '결정 필요' ? 'hot' : ''} ${ts.length ? '' : 'is-empty'}"><h2><span>${esc(c)}</span><span>${ts.length}</span></h2>${
      ts.length ? ts.map(t => {
        const tid = String(t.task_id || '').replace(/\s*\(.*\)\s*$/, '');
        return `<a class="tcard ${t.blocking.length ? 'blocked' : ''}" href="#/t/${encodeURIComponent(t.slug)}" title="${esc(t.dir)}">
        <div class="t">${esc(t.title || t.slug)}</div>
        <div class="now">${esc(nextAction(t))}</div>
        <div class="row">${t.kind ? chip(t.kind) : ''}${JIRA_KEY.test(tid) ? chip(tid) : ''}${c === '결정 필요' ? stageChip(t.stage) : ''}
          ${t.inbox_pending ? chip('반영 대기', 'blue') : ''}${t.blocking.length ? chip(`막힘 ${t.blocking.length}`, 'red') : ''}${waitChips(t)}
          ${t.errors.length ? chip(`형식 오류 ${t.errors.length}`, 'red') : ''}</div>
      </a>`; }).join('') : `<div class="empty">없음</div>`}</section>`;
  }).join('')}</div>`;
}

// ---------- 작업 ----------
function tabsOf(d) {
  const secs = Object.fromEntries(d.sections.map(s => [s.no, s]));
  const rows = n => (secs[n]?.blocks.find(b => b.type === 'table')?.rows.length) || 0;
  const tabs = [['요약', [1, 3, 0]], ['요구사항', [2], rows(2)], ['화면 상태', [4]], ['검토 항목', [5], rows(5)], ['설계', [6], rows(6)], ['수용 기준', [8], rows(8)]];
  if (d.questions_md) tabs.push(['질문지', 'q']);
  tabs.push(['구현·기록', [7, 9]]);
  return { tabs, secs };
}
function cardsToAnswer(d) { const a = d.inbox?.cards || {}; return (d.cards?.cards || []).map(c => ({ ...c, answer: a[c.id] })); }
function repliesToReview(d) {
  const tb = d.sections.find(s => s.no === 5)?.blocks.find(b => b.type === 'table'); if (!tb) return [];
  const h = tb.header, idx = k => h.indexOf(k), decided = d.inbox?.replies || {};
  return tb.rows.filter(r => r[idx('상태')] === '답 옴').map(r => ({ id: r[idx('ID')], what: r[idx('내용')], owner: r[idx('결정 주체')], reply: r[idx('답')], decision: decided[r[idx('ID')]] }));
}
function questionParts(d) { return d.questions_md.replace(/^#\s.*\n?/m, '').replace(/^---\s*$/gm, '').split(/\n(?=## )/); }
function noteOf(key, saved) { return drafts[key] ?? saved ?? ''; }
function renderTask(d) {
  const c = d.check, { tabs, secs } = tabsOf(d);
  if (!tabs.find(t => t[0] === ui.tab)) ui.tab = '요약';
  const cards = cardsToAnswer(d), replies = repliesToReview(d);
  const total = cards.length + replies.length, done = cards.filter(x => x.answer).length + replies.filter(x => x.decision).length;
  const submitted = !!d.inbox?.submitted;
  const qtable = secs[5]?.blocks.find(b => b.type === 'table');
  const owners = qtable ? [...new Set(qtable.rows.flatMap(r => roles(r[qtable.header.indexOf('결정 주체')])))] : [];

  let panel = `<h3>답할 것</h3><div class="muted" style="font-size:13px">${total ? `${total}개 중 ${done}개 답함` : '지금 답할 것이 없습니다.'}</div>`;
  if (submitted) panel += `<div class="banner">제출했습니다. 에이전트가 문서에 반영하면 이 화면이 저절로 바뀝니다.</div>`;
  const unansweredRec = cards.filter(x => !x.answer && x.options?.some(o => o.recommended));
  if (!submitted && unansweredRec.length > 1) panel += `<div style="margin-top:8px"><button class="btn" data-act="allrec">남은 ${unansweredRec.length}개 모두 추천대로</button></div>`;
  for (const r of replies) {
    const key = `reply:${r.id}`;
    panel += `<div class="qcard ${r.decision ? 'done' : ''}"><div class="hd"><span>${chip(r.id)} ${chip('답 옴', 'gold strong')}</span><span class="faint">${esc(r.owner)}</span></div>
      <div class="q">${inline(r.what)}</div><div class="reply">${inline(r.reply)}</div>
      ${['반영', '추가 질문', '빼기'].map(k => `<button class="opt ${r.decision?.decision === k ? 'sel' : ''}" data-act="reply" data-id="${esc(r.id)}" data-v="${k}"><span class="l">${{ '반영': '반영하고 진행', '추가 질문': '추가로 묻기', '빼기': '이 항목 빼기(범위 밖)' }[k]}${k === '반영' ? chip('추천', 'gold') : ''}</span></button>`).join('')}
      <textarea placeholder="메모 또는 추가로 물을 내용(선택)" data-note="${esc(key)}">${esc(noteOf(key, r.decision?.note))}</textarea></div>`;
  }
  for (const q of cards) {
    const key = `card:${q.id}`;
    panel += `<div class="qcard ${q.answer ? 'done' : ''}"><div class="hd"><span>${chip(q.header || q.id)} ${(q.qids || []).map(x => `<span class="faint" style="font-size:12px">${esc(x)}</span>`).join(' ')}</span>${q.answer ? chip('답함', 'green') : ''}</div>
      <div class="q">${inline(q.question)}</div>
      ${(q.options || []).map(o => `<button class="opt ${q.answer?.choice === o.label ? 'sel' : ''}" data-act="card" data-id="${esc(q.id)}" data-v="${esc(o.label)}">
        <span class="l">${esc(o.label)}${o.recommended ? chip('추천', 'gold') : ''}</span>${o.description ? `<span class="d">${inline(o.description)}</span>` : ''}
        ${o.preview ? `<details class="pv" data-pv="${esc(q.id + '|' + o.label)}" onclick="event.stopPropagation()"><summary>자세히</summary>${mdBlock(o.preview)}</details>` : ''}</button>`).join('')}
      <textarea placeholder="직접 답하기(선택) — 쓰면 이 내용으로 답합니다" data-note="${esc(key)}">${esc(noteOf(key, q.answer?.choice === '직접 답' ? q.answer.note : ''))}</textarea></div>`;
  }
  if (total) panel += `<div class="foot"><span class="muted" style="font-size:13px">${submitted ? '' : `남은 ${total - done}개`}</span><button class="btn primary" data-act="submit" ${done && !submitted ? '' : 'disabled'}>${submitted ? '제출함 · 반영 기다리는 중' : '제출 — 문서에 반영 요청'}</button></div>`;

  let doc = '';
  const cur = tabs.find(t => t[0] === ui.tab);
  if (cur[1] === 'q') {
    doc = questionParts(d).map((p, i) => !p.startsWith('## ') ? (p.trim() ? `<div class="muted">${mdBlock(p, true)}</div>` : '') :
      `<div class="qsec"><div class="hd"><b>${esc(p.split('\n')[0].replace(/^##\s*/, ''))}</b><button class="btn" data-act="copy" data-i="${i}">복사해서 Slack·Jira에 붙이기</button></div>${mdBlock(p.split('\n').slice(1).join('\n'), true)}</div>`).join('');
  } else {
    if (ui.tab === '검토 항목') {
      const states = ['전체', '답 옴', '질문함', '추천(확인 전)', '정함', '열림', '범위 밖'];
      doc += `<div class="filters"><span class="lab">상태</span>${states.map(s => `<button class="btn ${ui.filter === s ? 'on' : ''}" data-act="filter" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
        <div class="filters"><span class="lab">담당</span>${['전체', ...owners].map(s => `<button class="btn ${ui.owner === s ? 'on' : ''}" data-act="owner" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
    }
    doc += cur[1].map(n => secs[n] ? sectionHtml(secs[n], { filter: ui.tab === '검토 항목' }) : '').join('');
  }

  const tid = String(c.task_id || '').replace(/\s*\(.*\)\s*$/, '');
  const decided = [...USER_STAGES, '취소'].includes(c.stage);
  $app.innerHTML = `
  <section class="head"><a class="back" href="#/">‹ 현황판</a>
    <h2 title="${esc(d.dir)}">${esc(c.title || d.slug)}</h2>
    <div class="nowline">${esc(nextAction(c))}</div>
    <div class="meta">${stageChip(c.stage)}${c.kind ? chip(c.kind) : ''}${JIRA_KEY.test(tid) ? chip(tid) : ''}${c.inbox_pending ? chip('반영 대기', 'blue') : ''}${waitChips(c)}</div>
    <div class="summary"><span>막힘 <b>${c.blocking.length}</b></span><span>받은 답 <b>${c.replied.length}</b></span><span>기본값으로 진행 <b>${c.defaults.length}</b></span>
      ${c.proposals.length ? `<span>담당자에게 낸 설계 제안 <b>${c.proposals.length}</b></span>` : ''}
      ${decided && c.verdict !== c.stage ? `<span>문서 기준으로는 <b>${esc(c.verdict)}</b></span>` : ''}
      ${c.errors.length ? `<span class="err">형식 오류 ${c.errors.length}건</span>` : ''}</div>
    ${c.early_start && c.blocking.length ? `<div class="banner green">답을 기다리는 동안 먼저 해도 되는 것 — ${inline(c.early_start)}</div>` : ''}
    <div class="stages"><span class="muted" style="font-size:13px">이 작업을</span>
      ${USER_STAGES.map(s => `<button class="btn ${c.stage === s ? 'on' : ''}" data-act="stage" data-v="${s}">${s}</button>`).join('')}
      ${decided ? `<button class="btn" data-act="stage" data-v="${esc(c.verdict)}">자동 상태로 되돌리기 (${esc(c.verdict)})</button>` : ''}
      <button class="btn danger ${c.stage === '취소' ? 'on' : ''}" data-act="stage" data-v="취소">하지 않기로(취소)</button></div>
  </section>
  <div class="layout"><aside class="panel ${submitted ? 'submitted' : ''}">${panel}</aside>
    <section class="docs"><nav class="tabs">${tabs.map(t => `<button class="tab ${ui.tab === t[0] ? 'on' : ''}" data-act="tab" data-v="${t[0]}">${t[0]}${t[2] ? `<span class="n">${t[2]}</span>` : ''}</button>`).join('')}</nav>
      <div class="doc">${doc}</div></section></div>`;
  $app.querySelectorAll('[data-act="copy"]').forEach(b => b.onclick = () => {
    const p = questionParts(d)[+b.dataset.i] || '';
    navigator.clipboard.writeText(p.replace(/^##[^\n]*\n/, '').trim()).then(() => { b.textContent = '복사됨'; });
  });
}

// ---------- 동작 ----------
$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.dataset.act === 'copy') return;
  const slug = currentSlug(), act = el.dataset.act, v = el.dataset.v;
  try {
    if (act === 'tab') { ui.tab = v; return render(true); }
    if (act === 'filter') { ui.filter = v; return render(true); }
    if (act === 'owner') { ui.owner = v; return render(true); }
    if (act === 'stage') {
      const ask = v === '취소' ? '이 작업을 하지 않기로(취소) 합니다. 이유를 남겨 주세요.' : `'${v}'(으)로 바꿉니다. 이유를 한 줄 남길까요? (비워도 됩니다)`;
      const note = [...USER_STAGES, '취소'].includes(v) ? prompt(ask, '') : '';
      if (note === null) return;
      await post(taskUrl(slug, 'stage'), { value: v, note });
    }
    if (act === 'card') {
      await post(taskUrl(slug, 'inbox'), { type: 'card', id: el.dataset.id, choice: v });
      delete drafts[`card:${el.dataset.id}`];
    }
    if (act === 'reply') {
      const key = `reply:${el.dataset.id}`;
      const note = drafts[key] ?? last?.inbox?.replies?.[el.dataset.id]?.note ?? '';
      await post(taskUrl(slug, 'inbox'), { type: 'reply', qid: el.dataset.id, decision: v, note });
      delete drafts[key];
    }
    if (act === 'allrec') {
      for (const q of cardsToAnswer(last).filter(x => !x.answer)) {
        const rec = q.options?.find(o => o.recommended); if (rec) await post(taskUrl(slug, 'inbox'), { type: 'card', id: q.id, choice: rec.label });
      }
    }
    if (act === 'submit') await post(taskUrl(slug, 'inbox'), { type: 'submit' });
    render(true);
  } catch (err) { alert(err.message); }
});
$app.addEventListener('input', e => { const key = e.target.dataset?.note; if (key) drafts[key] = e.target.value; });
$app.addEventListener('change', async e => {
  // 메모는 저장만 하고 화면은 다시 그리지 않는다(바로 누른 버튼이 사라지지 않게)
  const key = e.target.dataset?.note; if (!key) return;
  const [kind, id] = key.split(/:(.*)/s), slug = currentSlug(), text = e.target.value.trim();
  try {
    if (kind === 'card') {
      const res = await post(taskUrl(slug, 'inbox'), text ? { type: 'card', id, choice: '직접 답', note: text } : { type: 'unset', id });
      if (last) last.inbox = res.inbox;
      delete drafts[key];
    }
    if (kind === 'reply') {
      // 결정 전이면 drafts 에 남겨 두고, 결정 버튼을 누를 때 함께 보낸다
      const prev = last?.inbox?.replies?.[id];
      if (prev) {
        const res = await post(taskUrl(slug, 'inbox'), { type: 'reply', qid: id, decision: prev.decision, note: text });
        if (last) last.inbox = res.inbox;
        delete drafts[key];
      }
    }
  } catch (err) { alert(err.message); }
});

function currentSlug() { const m = location.hash.match(/^#\/t\/([^?]+)/); return m ? decodeURIComponent(m[1]) : null; }
function hashTab() { const m = location.hash.match(/[?&]tab=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; }
function keepView(fn) {
  // 다시 그려도 스크롤과 펼친 '자세히'를 그대로 둔다
  const q = s => document.querySelector(s);
  const st = { p: q('.panel')?.scrollTop, d: q('.doc')?.scrollTop, y: window.scrollY, open: [...document.querySelectorAll('details[open][data-pv]')].map(x => x.dataset.pv) };
  fn();
  document.querySelectorAll('details[data-pv]').forEach(x => { if (st.open.includes(x.dataset.pv)) x.open = true; });
  if (st.p != null && q('.panel')) q('.panel').scrollTop = st.p;
  if (st.d != null && q('.doc')) q('.doc').scrollTop = st.d;
  window.scrollTo(0, st.y);
}
async function render(force) {
  const a = document.activeElement;
  if (!force && a && a.tagName === 'TEXTAREA') return; // 입력 중이면 새로고침하지 않는다
  try {
    const slug = currentSlug();
    const data = slug ? await api(taskUrl(slug)) : await api('/api/board');
    const sig = (slug || '') + '|' + ui.tab + '|' + JSON.stringify(data);
    document.getElementById('stamp').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
    if (!force && sig === lastSig) return;
    lastSig = sig; last = data;
    keepView(() => slug ? renderTask(data) : renderBoard(data));
  } catch (err) { $app.innerHTML = `<p class="err">${esc(err.message)}</p><p><a href="#/">현황판으로</a></p>`; lastSig = ''; }
}
window.addEventListener('hashchange', () => { ui.filter = '전체'; ui.owner = '전체'; if (hashTab()) ui.tab = hashTab(); lastSig = ''; render(true); });
if (hashTab()) ui.tab = hashTab();
render(true);
setInterval(() => render(false), 4000);
</script>
</body>
</html>
